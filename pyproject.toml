[project]
name = "madlove"
version = "2.0.0.dev0"
description = "Breakout-style arcade game about smoking, built for a coin-operated cabinet in 2019."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Stefan Avramescu" }]
requires-python = ">=3.11"
dependencies = [
    "pygame-ce>=2.5",
]

[project.scripts]
madlove = "madlove.__main__:run"

[build-system]
requires = ["uv_build>=0.9.26,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16",
]

[tool.ruff]
line-length = 120
src = ["src"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "preserve"

[tool.pytest.ini_options]
testpaths = ["tests"]
# a test that runs longer than this prints the stack of every thread, to show where it hangs
faulthandler_timeout = 60
