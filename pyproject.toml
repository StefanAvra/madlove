[project]
name = "madlove"
version = "2.0.0.dev0"
description = "Breakout-style arcade game about smoking, built for a coin-operated cabinet in 2019."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Stefan Avramescu" }]
requires-python = ">=3.11"
dependencies = [
    "pygame-ce>=2.5",
]

[project.optional-dependencies]
# Online high-score list (dropped in 2019, kept for reference)
online = [
    "firebase-admin>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "preserve"

[tool.pytest.ini_options]
testpaths = ["tests"]
# the game modules live in the repository root until they move into a package
pythonpath = ["."]
