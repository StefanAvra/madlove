name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    # the whole job takes about a minute; without this a hang runs for 6 hours
    timeout-minutes: 10
    env:
      # no display or sound card on the runner
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v7
      # setup-uv has no major version tag, so pin the release
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Check formatting
        run: uv run --frozen ruff format --check .
      - name: Test
        run: uv run --frozen pytest
